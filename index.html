<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card" aria-label="待辦清單">
        <header class="todo-header">
          <h1>待辦清單</h1>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="切換深色模式"
          >
            <span class="theme-icon" aria-hidden="true">🌙</span>
            <span class="theme-text">深色模式</span>
          </button>
        </header>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            type="text"
            placeholder="新增待辦事項..."
            maxlength="120"
          />
          <button type="submit">新增</button>
        </form>

        <div class="filter-bar" aria-label="待辦篩選">
          <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">未完成</button>
          <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">已完成</button>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <footer class="todo-footer">
          <span id="todo-summary">未完成: 0 項</span>
        </footer>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
